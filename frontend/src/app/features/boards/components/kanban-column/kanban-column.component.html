<section
  class="kanban-column max-h-[calc(100vh-4rem)] self-start bg-base-300 p-2 w-[85vw] sm:w-64 rounded-xl shadow flex-shrink-0 flex flex-col transition-colors"
  >
  <div class="flex flex-col p-2 gap-1 mb-2">
    <div class="flex items-center justify-between text-base-content/50">
      <header class="kanban-column__header cursor-grab flex items-center gap-2" cdkDragHandle>
        <h3 class="font-bold m-0 text-base-content">{{ column().name }}</h3>
        <span
          class="bg-base-100 text-base-content px-2 py-0.5 rounded-full text-xs font-semibold"
          >{{ tasks().length }}</span>
      </header>
      <ui-dropdown-menu direction="left">
        <ui-dropdown-menu-trigger>
        <ui-button
          variant="ghost"
          size="icon"
        >
          <svg lucideEllipsisVertical class="w-4 h-4"></svg>
        </ui-button>
        </ui-dropdown-menu-trigger>
        <ui-dropdown-menu-content>
          <ui-dropdown-menu-item>
            <svg lucideArchive class="w-4 h-4 mr-2"></svg>
            Archive Column
          </ui-dropdown-menu-item>
          <ui-dropdown-menu-item>
            <svg lucideTrash class="w-4 h-4 mr-2"></svg>
            Delete Column
          </ui-dropdown-menu-item>
        </ui-dropdown-menu-content>
      </ui-dropdown-menu>
    </div>
    @if (hasActiveFilters()) {
      <span class="text-xs text-primary font-semibold">{{ tasks().length }} matching tasks</span>
    }
  </div>
  <div
  class="kanban-column__task-list flex-1 min-h-0 p-1 rounded transition-colors overflow-y-auto gap-1"
  cdkDropList
  [id]="column().id"
  [cdkDropListData]="tasks()"
  [cdkDropListConnectedTo]="connectedTo()"
  (cdkDropListDropped)="onTaskDrop($event)"
  cdkScrollable
  >
    @for (task of tasks(); track task.id) {
      <app-kanban-task
        cdkDrag
        [task]="task"
        [columnIndex]="columnIndex()"
        [cdkDragBoundary]="'.kanban-board__columns'"
        [sourceColumnId]="column().id"
        (updateTitle)="taskUpdated.emit({ taskId: task.id, title: $event })"
        (toggleCompletion)="taskCompletionToggled.emit(task)"
        (openOverlay)="taskClicked.emit(task)"
      ></app-kanban-task>
    } @empty {
      <ui-empty-state 
        title="No Tasks" 
        description="Drag tasks here or add a new one."
        size="compact">
        <svg lucideAssignment class="w-5 h-5"></svg>
      </ui-empty-state>
    }
  </div>

  <div
    class="add-task p-1 flex items-center justify-start gap-1 text-base-content/70 transition-colors"
  >
    @if (!isInputOpen()) {
      <button
        class="add-task__button cursor-pointer hover:bg-base-content/10 border border-base-300 w-full flex items-center justify-center p-2 rounded-field bg-base-200 transition-colors"
        (click)="isInputOpen.set(true)"
      >
        <svg lucidePlus class="w-4 h-4 mr-1"></svg>
        Add a task
      </button>
    } @else {
      <input
        type="text"
        class="add-task__input p-1 text-base-content rounded-field w-full h-10 outline-none ring-1 ring-accent focus:ring-2 focus:ring-accent focus:outline-none"
        placeholder="Task title..."
        [value]="inputValue()"
        (input)="onInput($event)"
        (blur)="cancelInput()"
        (keydown.enter)="submitTask()"
        (keydown.escape)="cancelInput()"
        appAutofocus
      />
    }
  </div>
</section>
