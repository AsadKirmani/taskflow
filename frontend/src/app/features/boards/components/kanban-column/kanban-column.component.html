<section
  class="kanban-column self-start max-h-[65vh] w-64 bg-base-300 px-1 py-2 rounded-box flex-shrink-0 flex flex-col transition-colors"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  <div class="flex flex-col px-1">
    <header
      class="kanban-column__header cursor-grab flex items-center justify-between gap-2 mb-1"
      cdkDragHandle
    >
      <h3 class="font-bold ml-2 text-base-content">{{ column().name }}</h3>
      <div class="flex items-center gap-1 sm:gap-2 flex-wrap justify-between">
        <span
          class="bg-base-100 text-base-content px-2 py-0.5 rounded-full text-xs font-semibold"
          >{{ tasks().length }}</span
        >
        <ui-dropdown-menu direction="left">
          <ui-dropdown-menu-trigger>
            <ui-button variant="ghost" size="icon-sm">
              <svg lucideEllipsis class="w-4 h-4"></svg>
            </ui-button>
          </ui-dropdown-menu-trigger>
          <ui-dropdown-menu-content>
            <ui-dropdown-menu-item
              (click)="columnArchived.emit({ columnId: column().id, columnName: column().name })"
            >
              <svg lucideArchive class="w-4 h-4 mr-2"></svg>
              Archive Column
            </ui-dropdown-menu-item>
            <ui-dropdown-menu-item>
              <svg lucideTrash class="w-4 h-4 mr-2"></svg>
              Delete Column
            </ui-dropdown-menu-item>
          </ui-dropdown-menu-content>
        </ui-dropdown-menu>
      </div>
    </header>

    @if (hasActiveFilters()) {
      <span class="text-xs text-primary font-semibold">{{ tasks().length }} matching tasks</span>
    }
  </div>
  <div
    class="kanban-column__task-list flex-1 rounded-field p-1 transition-colors overflow-y-auto scrollbar-thin scrollbar-thumb-base-content/20 scrollbar-track-base-100 gap-1"
    cdkDropList
    [id]="column().id"
    [cdkDropListData]="tasks()"
    [cdkDropListConnectedTo]="connectedTo()"
    (cdkDropListDropped)="onTaskDrop($event)"
    cdkScrollable
  >
    @for (task of tasks(); track task.id) {
      <app-kanban-task
        cdkDrag
        [cdkDragStartDelay]="{ touch: 200, mouse: 0 }"
        [task]="task"
        [columnIndex]="columnIndex()"
        [cdkDragBoundary]="'.kanban-board__columns'"
        [sourceColumnId]="column().id"
        (updateTitle)="taskUpdated.emit({ taskId: task.id, title: $event })"
        (toggleCompletion)="taskCompletionToggled.emit(task)"
        (openOverlay)="taskClicked.emit(task)"
      ></app-kanban-task>
    } @empty {
      <ui-empty-state
        title="No Tasks"
        description="Drag tasks here or add a new one."
        size="compact"
      >
        <svg lucideCircleCheckBig class="w-5 h-5"></svg>
      </ui-empty-state>
    }
  </div>
  <div class="add-task flex flex-col w-full text-base-content/70 transition-colors p-2">
    @if (!isInputOpen()) {
      <ui-button
        variant="outline"
        (click)="isInputOpen.set(true)"
        [fullWidth]="true"
      >
        <svg lucidePlus class="w-4 h-4 mr-1.5"></svg>
        Add a card
      </ui-button>
    } @else {
      <div class="flex flex-col gap-2 w-full p-1">
        <textarea
          class="p-2.5 shadow-sm rounded-box w-full outline-none ring-2 ring-primary bg-base-100 text-base-content text-sm placeholder:text-base-content/50 resize-none"
          placeholder="Enter a title for this card..."
          [value]="inputValue()"
          (input)="onInput($event)"
          (keydown.enter)="submitTask(); $event.preventDefault()"
          (keydown.escape)="cancelInput()"
          appAutofocus
        ></textarea>
        
        <div class="flex items-center justify-start gap-2">
          <button
            class="px-3 py-1.5 rounded-btn bg-primary text-primary-content hover:bg-primary/90 border-none cursor-pointer text-sm font-medium transition-colors"
            (click)="submitTask()"
          >
            Add card
          </button>
          <button
            class="p-1.5 text-base-content/50 hover:text-base-content hover:bg-base-content/10 rounded-btn cursor-pointer border-none bg-transparent transition-colors flex items-center justify-center"
            (click)="cancelInput()"
          >
            <svg lucideX class="w-5 h-5"></svg>
          </button>
        </div>
      </div>
    }
  </div>
</section>
