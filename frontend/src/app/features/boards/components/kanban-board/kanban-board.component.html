<section class="kanban-board">
      <header class="kanban-board__header flex items-center justify-between mb-1 bg-white p-4 rounded-t-xl">
        <h1 class="text-2xl font-bold">{{ board?.name }}</h1>
       
      </header>

      <div
        class="kanban-board__columns flex items-start bg-white p-4 gap-4 rounded-b-xl"
        cdkDropList
        cdkDropListOrientation="horizontal"
        [cdkDropListData]="columns"
        (cdkDropListDropped)="onColumnDrop($event)"
      >
        @for (column of columns; track column.id) {
          <section class="kanban-column self-start bg-gray-100 p-2 w-64 rounded-xl shadow" cdkDrag [cdkDragData]="column">
          <div class="flex items-center justify-between p-2">
            <header class="kanban-column__header" cdkDragHandle>
              <h3>{{ column.name }}</h3>
            </header>
            <mat-icon class="">more_horiz</mat-icon>
          </div>

            <div
            cdkDropList
            [id]="column.id"
            [cdkDropListData]="tasksByColumn[column.id] ?? []"
            [cdkDropListConnectedTo]="connectedDropListIds"
            class="kanban-column__task-list p-1 min-h-10 rounded-lg border border-dashed border-gray-400 p-2"
            (cdkDropListDropped)="onTaskDrop($event, column.id)">
              @for (task of tasksByColumn[column.id] ?? []; track task.id) {
                <article class="task-card shadow rounded-lg text-start p-2 bg-white mb-2 group cursor-pointer transition-shadow hover:ring-2 hover:ring-blue-500 hover:ring-offset-2 hover:ring-offset-white" cdkDrag [cdkDragData]="task">
                  @if (activeEditTaskId !== task.id) {
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center justify-start gap-1">
                            <button type="button" class="task-card__mark-complete-button opacity-0 group-hover:opacity-100 transition-opacity" (click)="toggleTaskCompletion(task, $event)">
                                <mat-icon [class.text-green-600]="task.isCompleted">{{ task.isCompleted ? 'check_circle' : 'circle' }}</mat-icon>
                            </button>
                            <h4 class="task-card__title group-hover:translate-x-1 translate-x-[-20px] transition-transform transition-all duration-300" [class.line-through]="task.isCompleted">{{ task.title }}</h4>
                        </div>
                      <button
                        type="button"
                        class="task-card__button opacity-0 group-hover:opacity-100 transition-opacity"
                        (click)="startTaskEdit(task, $event)">
                        <mat-icon>edit</mat-icon>
                      </button>
                    </div>
                  } @else {
                    <div class="flex flex-col gap-2">
                      <input
                        type="text"
                        class="p-1 shadow rounded-lg w-full h-10 outline-none ring-1 ring-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        [value]="editTaskTitle"
                        (input)="onEditTaskTitleChange($any($event.target).value)"
                        (keydown.enter)="submitTaskEdit(task)"
                        (keydown.escape)="cancelTaskEdit()"
                      />
                      <div class="flex items-center justify-end gap-2">
                        <button type="button" class="text-xs px-2 py-1 rounded bg-gray-200 hover:bg-gray-300" (click)="cancelTaskEdit()">Cancel</button>
                        <button type="button" class="text-xs px-2 py-1 rounded bg-blue-500 text-white hover:bg-blue-600" (click)="submitTaskEdit(task)">Save</button>
                      </div>
                    </div>
                  }
                </article>
              }
            </div>

            <div
              class="add-task p-1 rounded cursor-pointer flex items-center justify-start gap-1 text-gray-600">
                @if (!isTaskInputOpen(column.id)) {
                  <button class="add-task__button" (click)="openTaskInput(column.id)">+ Add a task</button>
                } @else {
                  <input
                    type="text"
                    class="add-task__input p-1 shadow rounded-lg w-full h-12 outline-none ring-1 ring-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Task title..."
                    [value]="taskInputValues[column.id] ?? ''"
                    (input)="onTaskInputChange(column.id, $any($event.target).value)"
                    (blur)="closeTaskInput(column.id)"
                    (keydown.enter)="submitTaskInput(column.id)"
                    (keydown.escape)="closeTaskInput(column.id)"
                  />
                }
              </div>
              </section>
              }
              <div class="bg-gray-200 w-64 flex-shrink-0 hover:bg-gray-300 p-2 rounded cursor-pointer flex items-center justify-center gap-1 text-gray-600">
                <button class="add-column__button">+ Add Column</button>
              </div>
      </div>
    </section>
