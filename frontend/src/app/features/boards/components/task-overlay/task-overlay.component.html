<!-- Fixed background dim backdrop layer -->
<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-2 sm:p-4 animate-fade-in">
  
  <!-- Main Dialog Window Box Container -->
  <article class="bg-[#f1f2f4] w-full max-w-3xl rounded-xl shadow-2xl flex flex-col max-h-[90vh] text-[#172b4d] overflow-hidden">
    
    <!-- Modal Control Header -->
    <header class="p-4 sm:p-6 flex items-start justify-between pb-0">
      <div class="flex gap-3 items-start min-w-0 flex-1">
        <mat-icon class="mt-1 text-gray-600">payment</mat-icon>
        <div class="min-w-0 flex-1">
          <!-- Task Title Title Element -->
          <h2 class="text-xl font-semibold leading-tight break-words">{{ task()?.title }}</h2>
          <p class="text-xs text-gray-500 mt-1">
            in list <span class="underline cursor-pointer font-medium hover:text-gray-800">{{ columnName() }}</span>
          </p>
        </div>
      </div>
      <!-- Close Trigger Node -->
      <button (click)="close()" class="p-1.5 rounded-full hover:bg-black/10 transition-colors text-gray-600" aria-label="Close dialog">
        <mat-icon>close</mat-icon>
      </button>
    </header>

    <!-- Scrollable Dialog Panel Body -->
    <div class="flex-1 overflow-y-auto p-4 sm:p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
      
      <!-- Main Content Flow Body Columns (70%) -->
      <div class="md:col-span-3 flex flex-col gap-6">
        
        <!-- Action Configuration Ribbon Pills -->
        <div class="flex items-center flex-wrap gap-2 text-xs font-semibold pl-9">
          <button class="flex items-center gap-1 bg-black/5 hover:bg-black/10 px-3 py-1.5 rounded-sm transition-colors"><mat-icon class="text-sm w-4 h-4">add</mat-icon>Add</button>
          <button class="flex items-center gap-1 bg-black/5 hover:bg-black/10 px-3 py-1.5 rounded-sm transition-colors"><mat-icon class="text-sm w-4 h-4">label</mat-icon>Labels</button>
          <button class="flex items-center gap-1 bg-black/5 hover:bg-black/10 px-3 py-1.5 rounded-sm transition-colors"><mat-icon class="text-sm w-4 h-4">schedule</mat-icon>Dates</button>
          <button class="flex items-center gap-1 bg-black/5 hover:bg-black/10 px-3 py-1.5 rounded-sm transition-colors"><mat-icon class="text-sm w-4 h-4">select_check_box</mat-icon>Checklist</button>
          <button class="flex items-center gap-1 bg-black/5 hover:bg-black/10 px-3 py-1.5 rounded-sm transition-colors"><mat-icon class="text-sm w-4 h-4">person</mat-icon>Members</button>
        </div>

        <!-- Description Box Control Slot -->
        <div class="flex gap-3 items-start">
          <mat-icon class="mt-1 text-gray-600">subject</mat-icon>
          <div class="flex-1">
            <h3 class="font-semibold text-sm mb-2">Description</h3>
            <div class="bg-black/5 hover:bg-black/10 min-h-16 rounded-md p-3 text-sm text-gray-500 cursor-pointer transition-colors">
              Add a more detailed description...
            </div>
          </div>
        </div>

        <!-- Comments Logging Loop Flow -->
        <div class="flex gap-3 items-start">
          <mat-icon class="mt-1 text-gray-600">toc</mat-icon>
          <div class="flex-1">
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-semibold text-sm">Comments and activity</h3>
              <button class="text-xs bg-black/5 hover:bg-black/10 font-medium px-3 py-1.5 rounded-sm transition-colors">Show details</button>
            </div>
            
            <!-- Comment Form Node Field -->
            <div class="flex gap-3 items-start mb-4">
              <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold shadow-sm flex-shrink-0">
                AK
              </div>
              <div class="flex-1 bg-white shadow-sm ring-1 ring-black/10 rounded-md p-2">
                <input type="text" placeholder="Write a comment..." class="w-full text-sm outline-none px-1 py-1 text-gray-700 placeholder-gray-400" />
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Secondary Utility Quick Action Right Panels (30%) -->
      <div class="md:col-span-1 flex flex-col gap-2">
        <h4 class="text-xs font-bold text-gray-500 tracking-wider uppercase mb-1">Actions</h4>
        <button class="flex items-center gap-2 bg-[#e2e4e6] hover:bg-[#d6d8da] w-full text-left px-3 py-2 rounded-sm text-sm font-medium transition-colors"><mat-icon class="text-base w-4 h-4">bolt</mat-icon>Power-ups</button>
        <button class="flex items-center gap-2 bg-[#e2e4e6] hover:bg-[#d6d8da] w-full text-left px-3 py-2 rounded-sm text-sm font-medium transition-colors"><mat-icon class="text-base w-4 h-4">offline_bolt</mat-icon>Automations</button>
        <button class="flex items-center gap-2 bg-[#e2e4e6] hover:bg-[#d6d8da] w-full text-left px-3 py-2 rounded-sm text-sm font-medium transition-colors"><mat-icon class="text-base w-4 h-4">chat</mat-icon>Comments</button>
      </div>

    </div>
  </article>
</div>
