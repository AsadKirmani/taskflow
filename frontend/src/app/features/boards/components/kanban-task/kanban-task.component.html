<article
  draggable="true"
  (dragstart)="onDragStart($event)"
  (dragend)="onDragEnd($event)"
  (dragover)="$event.preventDefault()"
  (dragenter)="$event.preventDefault()"
  [class.opacity-50]="isDragging()"
  class="task-card shadow rounded-lg text-start text-base-content p-2 bg-base-100 mb-2 group cursor-grab active:cursor-grabbing transition-shadow hover:ring-2 hover:ring-blue-500 hover:ring-offset-2 hover:ring-offset-white"
  (click)="openOverlay.emit()"
>
  @if (!isEditing()) {
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center justify-start gap-2 min-w-0">
        <button
          type="button"
          class="task-card__mark-complete-button opacity-70 md:opacity-0 md:group-hover:opacity-100 transition-opacity bg-transparent border-none cursor-pointer p-0 m-0 flex items-center flex-shrink-0"
          (click)="$event.stopPropagation(); toggleCompletion.emit()"
        >
          @if (task().isCompleted) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="text-green-600"
            >
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          } @else {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="text-base-content/40 hover:text-green-600"
            >
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
          }
        </button>

        <h4
          class="task-card__title truncate m-0 font-medium text-sm transition-transform duration-300 transform translate-x-0 md:translate-x-[-22px] md:group-hover:translate-x-0"
          [class.line-through]="task().isCompleted"
        >
          {{ task().title }}
        </h4>
      </div>

      <button
        type="button"
        class="task-card__button opacity-70 md:opacity-0 md:group-hover:opacity-100 transition-opacity bg-transparent border-none cursor-pointer p-0 m-0 flex items-center flex-shrink-0 text-base-content/50 hover:text-blue-500"
        (click)="startEdit($event)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </button>
    </div>
  } @else {
    <div class="flex flex-col gap-2" (click)="$event.stopPropagation()">
      <input
        type="text"
        class="p-1 shadow rounded-lg w-full h-10 outline-none ring-1 ring-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-base-100 text-base-content"
        [value]="editValue()"
        (input)="onInput($event)"
        (keydown.enter)="save()"
        (keydown.escape)="cancel()"
        autofocus
      />
      <div class="flex items-center justify-end gap-2">
        <button
          type="button"
          class="text-xs px-2 py-1 rounded bg-gray-200 hover:bg-gray-300 text-gray-800 border-none cursor-pointer"
          (click)="cancel()"
        >
          Cancel
        </button>
        <button
          type="button"
          class="text-xs px-2 py-1 rounded bg-blue-500 text-white hover:bg-blue-600 border-none cursor-pointer"
          (click)="save()"
        >
          Save
        </button>
      </div>
    </div>
  }
</article>
