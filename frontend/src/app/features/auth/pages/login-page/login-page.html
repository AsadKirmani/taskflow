<section class="flex items-center justify-center mx-auto h-screen">
  <div class="p-8 bg-gray-100 rounded-lg shadow-md w-full max-w-md">
    <h1>Login</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-5">
        <label for="email" class="block mb-2.5 text-sm font-medium text-heading">Your email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="border border-gray-300 rounded-lg invalid:border-pink-500 invalid:text-pink-600 focus:border-sky-500 focus:outline focus:outline-sky-500 focus:invalid:border-pink-500 focus:invalid:outline-pink-500 disabled:border-gray-200 disabled:bg-gray-50 disabled:text-gray-500 disabled:shadow-none dark:disabled:border-gray-700 dark:disabled:bg-gray-800/20 w-full px-3 py-2.5 shadow-xs placeholder:text-body"
          placeholder="name@email.com"
          />
        </div>
        <div class="mb-5">
            <label for="password" class="block mb-2.5 text-sm font-medium text-heading"
            >Your password</label
            >
            <input
            type="password"
            id="password"
            formControlName="password"
            class="border border-gray-300 rounded-lg invalid:border-pink-500 invalid:text-pink-600 focus:border-sky-500 focus:outline focus:outline-sky-500 focus:invalid:border-pink-500 focus:invalid:outline-pink-500 disabled:border-gray-200 disabled:bg-gray-50 disabled:text-gray-500 disabled:shadow-none dark:disabled:border-gray-700 dark:disabled:bg-gray-800/20 w-full px-3 py-2.5 shadow-xs placeholder:text-body"
            placeholder="••••••••"
        />
      </div>
      <label for="remember" class="flex items-center mb-5">
        <input
          id="remember"
          type="checkbox"
          value=""
          class="w-4 h-4 border border-default-medium rounded-xs bg-neutral-secondary-medium focus:ring-2 focus:ring-brand-soft"
        />
        <p class="ms-2 text-sm font-medium text-heading select-none">
          I agree with the
          <a href="#" class="text-fg-brand hover:underline">terms and conditions</a>.
        </p>
      </label>
      <button
        type="submit"
        class="cursor-pointer text-white hover:bg-blue-500 bg-blue-600 box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded text-sm px-4 py-2.5 focus:outline-none"
      >
        Submit
      </button>
    </form>

    <p>
      Don’t have an account?
      <a routerLink="/auth/register">Register</a>
    </p>
  </div>
</section>
