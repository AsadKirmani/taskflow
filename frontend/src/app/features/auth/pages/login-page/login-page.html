<section class="flex items-center justify-center mx-auto h-screen bg-base-200 px-4">
  <div class="p-8 bg-base-100 rounded-box shadow-xl border border-base-300 w-full max-w-md">
    <h1 class="text-2xl font-extrabold text-base-content mb-6">Login</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-5">
        <label for="email" class="block mb-1.5 text-sm font-semibold text-base-content/90">Your email</label>
        <input
          type="email"
          id="email"
          appAutofocus
          formControlName="email"
          class="w-full p-2 border border-base-content/30 rounded-field bg-base-100 text-base-content placeholder:text-base-content/40 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/30 disabled:opacity-50 transition-all"
          placeholder="name@email.com"
        />
      </div>
      
      <div class="mb-5">
        <label for="password" class="block mb-1.5 text-sm font-semibold text-base-content/90">Your password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="w-full p-2 border border-base-content/30 rounded-field bg-base-100 text-base-content placeholder:text-base-content/40 focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/30 disabled:opacity-50 transition-all"
          placeholder="••••••••"
        />
      </div>
      
      <label for="remember" class="flex items-center mb-6 cursor-pointer">
        <input
          id="remember"
          type="checkbox"
          value=""
          class="w-4 h-4 rounded-sm border border-base-300 bg-base-100 checked:bg-primary"
        />
        <p class="ms-2 text-sm font-medium text-base-content select-none">
          I agree with the
          <a href="#" class="text-primary hover:text-primary/80 hover:underline transition-colors">terms and conditions</a>.
        </p>
      </label>
      
      <button
        type="submit"
        class="w-full p-field rounded-field bg-primary text-primary-content font-bold cursor-pointer transition-all hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-primary/50 border-none"
      >
        Submit
      </button>
    </form>

    <p class="mt-6 text-sm text-center text-base-content/70">
      Don’t have an account?
      <a routerLink="/auth/register" class="text-primary font-semibold hover:underline transition-colors">Register</a>
    </p>
  </div>
</section>
