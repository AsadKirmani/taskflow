  <div
    class="bg-base-300 border-b border-base-300 px-2 py-1 flex flex-wrap gap-1 items-center relative z-10"
  >
    <div class="flex items-center gap-1">
      <ui-button
        variant="ghost"
        size="sm"
        (clicked)="editor.chain().focus().toggleBold().run()"
        [class.bg-base-200]="editor.isActive('bold')"
        title="Bold (Ctrl+B)"
      >
        <span class="font-bold">B</span>
      </ui-button>

      <ui-button
        variant="ghost"
        size="sm"
        (clicked)="editor.chain().focus().toggleItalic().run()"
        [class.bg-base-200]="editor.isActive('italic')"
        title="Italic (Ctrl+I)"
      >
        <span class="italic">I</span>
      </ui-button>

      <ui-button
        variant="ghost"
        size="sm"
        (clicked)="editor.chain().focus().toggleStrike().run()"
        [class.bg-base-200]="editor.isActive('strike')"
        title="Strike (Ctrl+Shift+X)"
      >
        <span class="line-through">S</span>
      </ui-button>
    </div>

    <div class="w-px h-4 bg-base-content/30 mx-1"></div>

    <div class="relative group">
      <ui-button variant="ghost" size="sm" title="Text Style & Headings">
        <div class="flex items-center justify-between gap-1 min-w-[40px]">
          <div class="flex items-center justify-center w-6">
            @if (editor.isActive('heading', { level: 1 })) {
              <span class="font-bold text-sm">H1</span>
            } @else if (editor.isActive('heading', { level: 2 })) {
              <span class="font-bold text-sm">H2</span>
            } @else if (editor.isActive('heading', { level: 3 })) {
              <span class="font-bold text-sm">H3</span>
            } @else {
              <svg lucideType class="w-4 h-4"></svg>
            }
          </div>
          <svg lucideChevronDown class="w-4 h-4"></svg>
        </div>
      </ui-button>

      <div
        class="absolute left-0 mt-0 w-44 bg-base-100 border border-base-300 rounded-md shadow-lg hidden group-hover:flex flex-col py-1 z-50"
      >
        <button
          (click)="editor.chain().focus().setParagraph().run()"
          [class.bg-base-200.text-base-content]="editor.isActive('paragraph')"
          class="text-left px-3 py-1.5 text-sm text-base-content hover:bg-base-200 transition-colors"
          title="Paragraph (Ctrl+Alt+0)"
        >
          Normal Text
        </button>
        <button
          (click)="editor.chain().focus().toggleHeading({ level: 1 }).run()"
          [class.bg-base-200.text-base-content]="editor.isActive('heading', { level: 1 })"
          class="text-left px-3 py-1.5 text-lg font-bold text-base-content hover:bg-base-200 transition-colors"
          title="Heading 1 (Ctrl+Alt+1)"
        >
          Heading 1
        </button>
        <button
          (click)="editor.chain().focus().toggleHeading({ level: 2 }).run()"
          [class.bg-base-200.text-base-content]="editor.isActive('heading', { level: 2 })"
          class="text-left px-3 py-1.5 text-base font-bold text-base-content hover:bg-base-200 transition-colors"
          title="Heading 2 (Ctrl+Alt+2)"
        >
          Heading 2
        </button>
        <button
          (click)="editor.chain().focus().toggleHeading({ level: 3 }).run()"
          [class.bg-base-200.text-base-content]="editor.isActive('heading', { level: 3 })"
          class="text-left px-3 py-1.5 text-sm font-bold text-base-content hover:bg-base-200 transition-colors"
          title="Heading 3 (Ctrl+Alt+3)"
        >
          Heading 3
        </button>
      </div>
    </div>

    <div class="w-px h-4 bg-base-content/30 mx-1"></div>

    <div class="relative group">
      <ui-button variant="ghost" size="sm" title="Lists">
        <div class="flex items-center gap-1">
          <div class="flex items-center justify-center w-5">
            @if (editor.isActive('orderedList')) {
              <svg lucideListOrdered class="w-4 h-4"></svg>
            } @else {
              <svg lucideList class="w-4 h-4"></svg>
            }
          </div>
          <svg lucideChevronDown class="w-4 h-4"></svg>
        </div>
      </ui-button>

      <div
        class="absolute left-0 mt-0 w-48 bg-base-100 border border-base-300 rounded-md shadow-lg hidden group-hover:flex flex-col py-1 z-50"
      >
        <button
          (click)="editor.chain().focus().toggleBulletList().run()"
          [class.bg-base-200.text-base-content]="editor.isActive('bulletList')"
          class="flex items-center gap-2 px-3 py-1.5 text-sm text-base-content hover:bg-base-200 transition-colors"
          title="Bullet List (Ctrl+Shift+8)"
        >
          <svg lucideList class="w-4 h-4"></svg> Bullet List
        </button>
        <button
          (click)="editor.chain().focus().toggleOrderedList().run()"
          [class.bg-base-200.text-base-content]="editor.isActive('orderedList')"
          class="flex items-center gap-2 px-3 py-1.5 text-sm text-base-content hover:bg-base-200 transition-colors"
          title="Numbered List (Ctrl+Shift+7)"
        >
          <svg lucideListOrdered class="w-4 h-4"></svg> Numbered List
        </button>
      </div>
    </div>

    <div class="w-px h-4 bg-base-content/30 mx-2"></div>

    <div class="flex items-center gap-1">
      <ui-button
        variant="ghost"
        size="sm"
        (clicked)="editor.chain().focus().toggleBlockquote().run()"
        [class.bg-base-200]="editor.isActive('blockquote')"
        title="Blockquote (Ctrl+Shift+B)"
      >
        Quote
      </ui-button>

      <ui-button
        variant="ghost"
        size="sm"
        (clicked)="editor.chain().focus().setHorizontalRule().run()"
        title="Insert Horizontal Line"
      >
        Divider
      </ui-button>

      <ui-button
        variant="ghost"
        size="sm"
        (clicked)="
          editor.chain().focus().unsetAllMarks().run(); editor.chain().focus().clearNodes().run()
        "
        title="Clear All Formatting"
      >
        <span class="text-warning">Reset Format</span>
      </ui-button>
    </div>

    <div class="flex-1"></div>

    <div class="flex items-center gap-1">
      <ui-button
        variant="ghost"
        size="sm"
        (clicked)="editor.chain().focus().undo().run()"
        [disabled]="!editor.can().undo()"
        title="Undo (Ctrl+Z)"
      >
        Undo
      </ui-button>

      <ui-button
        variant="ghost"
        size="sm"
        (clicked)="editor.chain().focus().redo().run()"
        [disabled]="!editor.can().redo()"
        title="Redo (Ctrl+Y)"
      >
        Redo
      </ui-button>
    </div>
  </div>

  <tiptap-editor
    [editor]="editor"
    class="p-4 block outline-none cursor-text"
    [style.min-height]="minHeight()"
  >
  </tiptap-editor>
</div>
